# Só o que difere do padrão do detekt (buildUponDefaultConfig = true no build).
# Para ver todas as regras e valores padrão: ./gradlew detektGenerateConfig
#
# Pastas de teste: o padrão do detekt relaxa algumas regras em test, androidTest,
# commonTest, jvmTest..., mas ainda não conhece androidHostTest e androidDeviceTest, as
# pastas do plugin KMP do AGP 9 (usadas pelo :core:data). A lista completa fica na âncora
# &testSources e é repetida (*testSources) nas regras que o padrão relaxa nos testes.

naming:
  FunctionNaming:
    # Funções @Composable usam PascalCase, convenção oficial do Compose.
    ignoreAnnotated: ['Composable']
    # Testes usam nomes com espaço entre crases, que descrevem o comportamento.
    excludes: &testSources ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/androidHostTest/**', '**/androidDeviceTest/**', '**/jsTest/**', '**/iosTest/**']

complexity:
  LongParameterList:
    # Composables recebem estado + callbacks por parâmetro (state hoisting); parâmetros
    # com valor padrão (modifier, cores...) são opcionais e não pesam para quem chama.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    # Um Composable de tela é uma árvore de UI declarativa; o tamanho não indica lógica.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Um DAO do Room é um catálogo de consultas: muitas funções pequenas é o esperado.
    ignoreAnnotated: ['Dao']
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    excludes: *testSources

style:
  MagicNumber:
    # Medidas de layout (16.dp, 0.5f) são valores de design, não números mágicos.
    ignoreAnnotated: ['Composable', 'Preview']
    # Mesma lista dos testes, mais os scripts do Gradle (como no padrão).
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/androidHostTest/**', '**/androidDeviceTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts']
  UnusedPrivateFunction:
    # @Preview privada é usada pelo Android Studio, não pelo código.
    allowedNames: '.*Preview'
  ReturnCount:
    # Retorno antecipado no começo da função (guard clause) deixa o código mais plano.
    excludeGuardClauses: true

exceptions:
  TooGenericExceptionCaught:
    excludes: *testSources

performance:
  ForEachOnRange:
    excludes: *testSources
  SpreadOperator:
    excludes: *testSources

potential-bugs:
  UnsafeCallOnNullableType:
    excludes: *testSources

ktlint:
  # Estas regras juntam numa linha só toda assinatura que couber, inclusive as escritas
  # uma por linha com vírgula no final (estilo oficial do Kotlin, que gera diffs menores).
  # O formatador do Android Studio não faz isso, então elas brigariam com o IDE.
  ClassSignature:
    active: false
  FunctionSignature:
    active: false
  # Puramente estético; o padrão do formatador do IDE não insere essas linhas.
  BlankLineBetweenWhenConditions:
    active: false
