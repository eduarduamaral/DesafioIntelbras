name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Static analysis (detekt + Android Lint)
        run: ./gradlew detekt lintDebug
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      # testDebugUnitTest cobre os módulos Android. :core:domain e :core:data são KMP, com
      # nomes de tarefa próprios (jvmTest e testAndroidHostTest); os alvos iOS só rodam no Mac.
      # :core:testing e :tools:mock-api são Kotlin/JVM ("test").
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:domain:jvmTest :core:data:testAndroidHostTest :core:testing:test :tools:mock-api:test
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      # Sempre publica, para quem avaliar ver o resultado da análise mesmo com o CI verde.
      # Um relatório por módulo (app, core/*, feature/*).
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-debug.html
